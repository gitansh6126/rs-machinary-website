# Builds the catalog from data/*.json and deploys the whole site to GitHub Pages.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to commit regenerated artifacts back to main
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build catalog (js/products-data*.js + sitemap from data/*.json)
        run: node scripts/build-catalog.js
      - name: Commit regenerated artifacts back to main (keeps repo in sync)
        run: |
          git config user.name  "rsmachinery-admin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/products-data.js js/products-data-hi.js sitemap.xml docs/manifest.json
          git diff --cached --quiet || git commit -m "build: regenerate catalog artifacts from data/*.json [skip ci]"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
