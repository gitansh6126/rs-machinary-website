<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>img.rsmachinary.in</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,sans-serif;background:#f3f4f6;color:#1f2937;min-height:100vh}

/* Top Bar */
.topbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:0 24px;display:flex;align-items:center;height:52px;position:sticky;top:0;z-index:50}
.topbar-brand{font-weight:700;font-size:1rem;color:#111827;letter-spacing:-.01em}
.topbar-brand span{color:#6366f1}
.topbar-sub{font-size:.78rem;color:#9ca3af;margin-left:12px;padding-left:12px;border-left:1px solid #e5e7eb}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.78rem;color:#9ca3af}

/* Tabs */
.tabbar{background:#fff;border-bottom:1px solid #e5e7eb;display:flex;padding:0 24px;gap:0;position:sticky;top:52px;z-index:49}
.tab{padding:12px 24px;border:none;background:none;font-size:.85rem;font-weight:500;color:#6b7280;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;margin-bottom:-1px}
.tab:hover{color:#374151}
.tab.active{color:#6366f1;border-bottom-color:#6366f1;font-weight:600}

/* Layout */
.container{max-width:1200px;margin:0 auto;padding:24px}
.tab-content{display:none}
.tab-content.active{display:block}

/* Upload Section */
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:800px){.upload-grid{grid-template-columns:1fr}}

.panel{background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden}
.panel-h{padding:14px 20px;border-bottom:1px solid #e5e7eb;font-size:.82rem;font-weight:600;color:#374151;text-transform:uppercase;letter-spacing:.04em}
.panel-b{padding:20px}

.upload-zone{position:relative;border:2px dashed #d1d5db;border-radius:8px;padding:48px 24px;text-align:center;cursor:pointer;transition:all .2s;background:#fafafa}
.upload-zone:hover,.upload-zone.drag-over{border-color:#6366f1;background:#f5f3ff}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-zone-icon{font-size:2.4rem;margin-bottom:8px;line-height:1;color:#9ca3af}
.upload-zone-title{font-size:.95rem;color:#374151;margin:0 0 2px}
.upload-zone-title strong{color:#6366f1;font-weight:600}
.upload-zone-hint{font-size:.78rem;color:#9ca3af;margin:6px 0 0}

.drop-active .upload-zone-icon{color:#6366f1}

.preview-img{width:100%;max-height:300px;object-fit:contain;border-radius:6px;background:#f9fafb}
.preview-info{margin-top:10px;display:flex;justify-content:space-between;font-size:.82rem;color:#6b7280}
.preview-info .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border:none;border-radius:8px;font-size:.85rem;font-weight:500;cursor:pointer;transition:all .1s;text-decoration:none;line-height:1.4}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:#6366f1;color:#fff}
.btn-primary:hover:not(:disabled){background:#4f46e5}
.btn-success{background:#059669;color:#fff}
.btn-success:hover:not(:disabled){background:#047857}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover:not(:disabled){background:#dc2626}
.btn-outline{background:transparent;border:1px solid #d1d5db;color:#6b7280}
.btn-outline:hover:not(:disabled){border-color:#9ca3af;color:#374151}

.btn-block{width:100%;justify-content:center}
.btn-sm{padding:6px 12px;font-size:.78rem;border-radius:6px}
.btn-icon{width:34px;padding:0;justify-content:center}

.btn-group{display:flex;gap:8px}

/* Status */
.status{margin-top:12px;font-size:.82rem;color:#6b7280;min-height:1.3em;text-align:center}
.status.success{color:#059669}
.status.error{color:#ef4444}

/* Result row */
.result-row{display:none;align-items:center;gap:8px;margin-top:12px;padding:10px 14px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px}
.result-row.visible{display:flex}
.result-row input{flex:1;background:transparent;border:none;color:#4f46e5;font-size:.82rem;outline:none;font-family:'SF Mono',Consolas,monospace}
.result-row .btn{flex-shrink:0}

.spinner{display:inline-block;width:16px;height:16px;border:2px solid #e5e7eb;border-top-color:#6366f1;border-radius:50%;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Gallery */
.gallery-bar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.gallery-bar .btn{margin:0}
.gallery-search{flex:1;min-width:200px;padding:9px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:.85rem;outline:none;background:#fff;color:#1f2937;transition:border-color .15s}
.gallery-search:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.gallery-search::placeholder{color:#9ca3af}

.gallery-empty{text-align:center;padding:60px 24px;color:#9ca3af;font-size:.9rem}

.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.gallery-item{background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;transition:box-shadow .15s,border-color .15s}
.gallery-item:hover{border-color:#d1d5db;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.gallery-item img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;cursor:pointer;background:#f3f4f6}
.gallery-item .meta{padding:10px 14px 0}
.gallery-item .meta .fname{font-size:.82rem;color:#374151;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.gallery-item .meta .fstats{display:flex;justify-content:space-between;font-size:.72rem;color:#9ca3af;margin-top:3px}
.gallery-item .actions{display:flex;gap:6px;padding:10px 14px}
.gallery-item .actions .btn{flex:1}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2937;border-radius:10px;padding:12px 24px;font-size:.85rem;color:#fff;box-shadow:0 8px 32px rgba(0,0,0,.2);opacity:0;transition:all .2s;pointer-events:none;z-index:100}
.toast.show{opacity:1;pointer-events:auto}

/* Skeleton */
.skeleton{background:linear-gradient(90deg,#e5e7eb 25%,#f3f4f6 50%,#e5e7eb 75%);background-size:200% 100%;animation:shimmer 1s infinite;border-radius:6px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

@media(max-width:700px){
.topbar{padding:0 16px}
.tabbar{padding:0 16px}
.tab{padding:10px 14px;font-size:.82rem}
.container{padding:16px}
.upload-zone{padding:32px 16px}
.gallery-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
</style>
</head>
<body>

<div class="topbar">
<div class="topbar-brand">img.<span>rsmachinary</span>.in</div>
<div class="topbar-sub">Image to WebP Converter</div>
<div class="topbar-right">v2 &middot; q80</div>
</div>

<div class="tabbar">
<button class="tab active" data-tab="upload">Upload</button>
<button class="tab" data-tab="gallery">Gallery</button>
</div>

<div class="container">

<div class="tab-content active" id="tab-upload">
<div class="upload-grid">
<div class="panel">
<div class="panel-h">Select Image</div>
<div class="panel-b">
<div class="upload-zone" id="uploadZone">
<div class="upload-zone-icon">&#128247;</div>
<p class="upload-zone-title"><strong>Click to browse</strong> or drag here</p>
<p class="upload-zone-hint">PNG &middot; JPEG &middot; WebP &middot; GIF &mdash; max 10MB</p>
<input type="file" id="fileInput" accept="image/png,image/jpeg,image/jpg,image/webp,image/gif">
</div>

<div id="previewWrap" style="display:none;margin-top:16px">
<img class="preview-img" id="preview" src="" alt="">
<div class="preview-info">
<span class="name" id="fileName"></span>
<span id="fileSize"></span>
</div>
</div>
</div>
</div>

<div class="panel">
<div class="panel-h">Convert</div>
<div class="panel-b">
<button class="btn btn-primary btn-block" id="convertBtn" disabled>Convert to WebP</button>

<div class="status" id="status"></div>

<div class="result-row" id="resultRow">
<input id="resultUrl" readonly spellcheck="false">
<button class="btn btn-success btn-sm" id="copyBtn">Copy</button>
</div>
</div>
</div>
</div>
</div>

<div class="tab-content" id="tab-gallery">
<div class="gallery-bar">
<input class="gallery-search" id="gallerySearch" type="text" placeholder="Filter images&hellip;">
<button class="btn btn-outline" id="refreshBtn">&#x21bb;</button>
</div>

<div id="galleryGrid" class="gallery-grid"></div>
<div id="galleryEmpty" class="gallery-empty" style="display:none">No images yet &mdash; upload one.</div>
</div>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
var fileInput=document.getElementById('fileInput');
var uploadZone=document.getElementById('uploadZone');
var previewWrap=document.getElementById('previewWrap');
var preview=document.getElementById('preview');
var fileName=document.getElementById('fileName');
var fileSize=document.getElementById('fileSize');
var convertBtn=document.getElementById('convertBtn');
var statusEl=document.getElementById('status');
var resultRow=document.getElementById('resultRow');
var resultUrl=document.getElementById('resultUrl');
var copyBtn=document.getElementById('copyBtn');
var toast=document.getElementById('toast');
var tabs=document.querySelectorAll('.tab');
var galleryGrid=document.getElementById('galleryGrid');
var galleryEmpty=document.getElementById('galleryEmpty');
var gallerySearch=document.getElementById('gallerySearch');
var refreshBtn=document.getElementById('refreshBtn');

var selectedFile=null;
var toastTimer=null;

// Tabs
tabs.forEach(function(t){t.addEventListener('click',function(){
tabs.forEach(function(x){x.classList.remove('active')});
this.classList.add('active');
document.querySelectorAll('.tab-content').forEach(function(c){c.classList.remove('active')});
document.getElementById('tab-'+this.dataset.tab).classList.add('active');
if(this.dataset.tab==='gallery'&&!galleryGrid.children.length) loadGallery();
})});

// Upload
fileInput.addEventListener('change',function(){
var file=fileInput.files[0];if(!file)return;
selectedFile=file;convertBtn.disabled=false;
statusEl.textContent='';statusEl.className='status';
resultRow.classList.remove('visible');
var reader=new FileReader();
reader.onload=function(e){preview.src=e.target.result;previewWrap.style.display='block';fileName.textContent=file.name;fileSize.textContent=formatSize(file.size)};
reader.readAsDataURL(file);
});

uploadZone.addEventListener('dragover',function(e){e.preventDefault();uploadZone.classList.add('drop-active')});
uploadZone.addEventListener('dragleave',function(){uploadZone.classList.remove('drop-active')});
uploadZone.addEventListener('drop',function(e){e.preventDefault();uploadZone.classList.remove('drop-active');var f=e.dataTransfer.files;if(f.length){fileInput.files=f;fileInput.dispatchEvent(new Event('change'))}});

convertBtn.addEventListener('click',function(){
if(!selectedFile)return;
convertBtn.disabled=true;convertBtn.innerHTML='<span class="spinner"></span> Converting&hellip;';
statusEl.textContent='Processing&hellip;';statusEl.className='status';
resultRow.classList.remove('visible');
var fd=new FormData();fd.append('image',selectedFile);
fetch('upload.php',{method:'POST',body:fd})
.then(function(r){return r.json()})
.then(function(res){
convertBtn.disabled=false;convertBtn.innerHTML='Convert to WebP';
if(res.success){
resultUrl.value=res.url;
resultRow.classList.add('visible');
statusEl.textContent='Converted successfully!';statusEl.className='status success';
previewWrap.style.display='none';
selectedFile=null;convertBtn.disabled=true;fileInput.value='';
} else {
statusEl.textContent=res.error||'Conversion failed';statusEl.className='status error';
}
})
.catch(function(){
convertBtn.disabled=false;convertBtn.innerHTML='Convert to WebP';
statusEl.textContent='Network error.';statusEl.className='status error';
});
});

copyBtn.addEventListener('click',function(){
if(resultUrl.value) copyToClipboard(resultUrl.value,this);
});

// Gallery
function loadGallery(q){
galleryGrid.innerHTML='<div style="grid-column:1/-1;display:flex;gap:8px;padding:24px;justify-content:center">'+
Array(4).fill('<div class="skeleton" style="height:180px;flex:1"></div>').join('')+'</div>';
galleryEmpty.style.display='none';
var url='list.php';
if(q) url+='?search='+encodeURIComponent(q);
fetch(url)
.then(function(r){return r.json()})
.then(function(res){
if(res.success&&res.data.length){
renderGallery(q?res.data.filter(function(i){return i.filename.toLowerCase().includes(q.toLowerCase())}):res.data);
} else {
galleryGrid.innerHTML='';galleryEmpty.style.display='block';
}
})
.catch(function(){
galleryGrid.innerHTML='';galleryEmpty.style.display='block';galleryEmpty.textContent='Failed to load.';
});
}

function renderGallery(items){
if(!items.length){galleryGrid.innerHTML='';galleryEmpty.style.display='block';return}
galleryEmpty.style.display='none';
var html='';
items.forEach(function(img){
var d=new Date(img.modified*1000);
html+='<div class="gallery-item">'+
'<img src="'+img.url+'" alt="'+img.filename+'" loading="lazy" onclick="window.open(\''+img.url+'\',\'_blank\')">'+
'<div class="meta"><div class="fname" title="'+img.filename+'">'+img.filename+'</div>'+
'<div class="fstats"><span>'+img.size_formatted+'</span><span>'+d.toLocaleDateString()+'</span></div></div>'+
'<div class="actions">'+
'<button class="btn btn-success btn-sm" onclick="window.copyItem(\''+img.url+'\',this)">Copy Link</button>'+
'<button class="btn btn-danger btn-sm" onclick="window.delItem(\''+img.filename+'\',this)">Delete</button>'+
'</div></div>';
});
galleryGrid.innerHTML=html;
}

window.copyItem=function(url,btn){
copyToClipboard(url,btn);
};

window.delItem=function(filename,btn){
if(!confirm('Delete "'+filename+'"?')) return;
var orig=btn.innerHTML;btn.disabled=true;btn.innerHTML='...';
fetch('delete.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:filename})})
.then(function(r){return r.json()})
.then(function(res){
if(res.success){
showToast('Deleted');
loadGallery(gallerySearch.value);
} else {
showToast(res.error||'Delete failed');
btn.disabled=false;btn.innerHTML=orig;
}
})
.catch(function(){
showToast('Network error');
btn.disabled=false;btn.innerHTML=orig;
});
};

var searchTimer=null;
gallerySearch.addEventListener('input',function(){
clearTimeout(searchTimer);
searchTimer=setTimeout(function(){loadGallery(gallerySearch.value||'')},400);
});

refreshBtn.addEventListener('click',function(){loadGallery(gallerySearch.value)});

if(document.querySelector('.tab.active').dataset.tab==='gallery') loadGallery();

function copyToClipboard(text,btn){
try {
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(text).then(function(){
var orig=btn.textContent;btn.textContent='Copied!';
if(btn.classList)btn.classList.add('copied');
setTimeout(function(){btn.textContent=orig;if(btn.classList)btn.classList.remove('copied')},2000);
});
} else {
var ta=document.createElement('textarea');
ta.value=text;ta.style.cssText='position:fixed;opacity:0';
document.body.appendChild(ta);ta.select();
document.execCommand('copy');document.body.removeChild(ta);
var orig=btn.textContent;btn.textContent='Copied!';
setTimeout(function(){btn.textContent=orig},2000);
}
} catch(e){showToast('Copy failed')}
}

function showToast(msg){
if(toastTimer) clearTimeout(toastTimer);
toast.textContent=msg;toast.className='toast show';
toastTimer=setTimeout(function(){toast.classList.remove('show')},2500);
}

function formatSize(bytes){
if(bytes<1024)return bytes+' B';
if(bytes<1048576)return(bytes/1024).toFixed(1)+' KB';
return(bytes/1048576).toFixed(1)+' MB';
}
})();
</script>
</body>
</html>
