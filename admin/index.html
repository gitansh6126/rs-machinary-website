<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - RSMachinery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="login">
    <div class="login-page">
        <div class="login-card">
            <h1>RSMachinery Admin</h1>
            <p>Enter your password to access the admin panel.</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter admin password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary">Sign In</button>
                <p id="loginError" class="login-error"></p>
            </form>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
