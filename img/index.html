<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>img.rsmachinary.in</title>
<style>
:root {
  --bg: #09090b;
  --surface: #18181b;
  --surface-hover: #1f1f23;
  --surface-active: #27272a;
  --border: #27272a;
  --border-hover: #3f3f46;
  --text: #fafafa;
  --text-secondary: #a1a1aa;
  --text-muted: #71717a;
  --primary: #6366f1;
  --primary-hover: #5558e6;
  --primary-subtle: rgba(99,102,241,.1);
  --success: #22c55e;
  --success-subtle: rgba(34,197,94,.1);
  --error: #ef4444;
  --error-subtle: rgba(239,68,68,.1);
  --warning: #f59e0b;
  --radius: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --shadow: 0 1px 2px rgba(0,0,0,.6);
  --shadow-lg: 0 4px 24px rgba(0,0,0,.4);
  --transition: 150ms cubic-bezier(.4,0,.2,1);
}
[data-theme="light"] {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --surface-hover: #fafafa;
  --surface-active: #e5e7eb;
  --border: #e5e7eb;
  --border-hover: #d1d5db;
  --text: #111827;
  --text-secondary: #4b5563;
  --text-muted: #9ca3af;
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --primary-subtle: rgba(99,102,241,.08);
  --success: #16a34a;
  --success-subtle: rgba(22,163,74,.08);
  --error: #dc2626;
  --error-subtle: rgba(220,38,38,.08);
  --warning: #d97706;
  --shadow: 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg: 0 4px 24px rgba(0,0,0,.08);
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Oxygen,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--primary);color:#fff}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface-active);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--border-hover)}

.theme-btn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border:none;border-radius:6px;cursor:pointer;background:transparent;color:var(--text-muted);transition:all var(--transition);flex-shrink:0}
.theme-btn:hover{color:var(--text);background:var(--surface-active)}
.theme-btn svg{width:16px;height:16px}
[data-theme="light"] .theme-btn .moon{display:none}
[data-theme="light"] .theme-btn .sun{display:block}
.theme-btn .sun{display:none}
.theme-btn .moon{display:block}

.topbar{position:sticky;top:0;z-index:50;background:rgba(9,9,11,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
[data-theme="light"] .topbar{background:rgba(255,255,255,.8)}
.topbar-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;height:64px;padding:0 24px;gap:24px}
.brand{font-weight:700;font-size:14px;color:var(--text);letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--primary)}
.stats-group{display:flex;align-items:center;gap:16px;margin-left:auto}
.stat{display:flex;align-items:baseline;gap:4px;font-size:12px;white-space:nowrap}
.stat-value{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.stat-label{color:var(--text-muted)}
.stat-sep{width:1px;height:16px;background:var(--border)}

.main{max-width:1280px;margin:0 auto;padding:24px}

.drop-zone{position:relative;border:2px dashed var(--border);border-radius:var(--radius-xl);padding:56px 24px;text-align:center;cursor:pointer;transition:all var(--transition);background:var(--surface);overflow:hidden}
.drop-zone:hover{border-color:var(--primary);background:var(--primary-subtle)}
.drop-zone.drag-over{border-color:var(--primary);background:var(--primary-subtle);transform:scale(1.005)}
.drop-zone.compact{padding:20px 24px;display:flex;align-items:center;gap:16px;border-radius:var(--radius-lg)}
.drop-zone.compact .drop-icon{width:32px;height:32px;flex-shrink:0}
.drop-zone.compact .drop-icon svg{width:32px;height:32px}
.drop-zone.compact .drop-title{font-size:14px;margin:0}
.drop-zone.compact .drop-hint{display:none}
.drop-zone.compact .drop-or{display:none}
.drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop-icon{width:48px;height:48px;margin:0 auto 12px;color:var(--text-muted);transition:color var(--transition)}
.drop-zone:hover .drop-icon{color:var(--primary)}
.drop-icon svg{width:48px;height:48px}
.drop-title{margin:0;font-size:18px;font-weight:600;color:var(--text-secondary)}
.drop-title strong{color:var(--text);font-weight:600}
.drop-hint{margin:6px 0 0;font-size:13px;color:var(--text-muted)}
.drop-or{font-size:13px;color:var(--text-muted);margin:6px 0 0}
.drop-or kbd{display:inline-block;padding:1px 6px;font-size:11px;font-family:inherit;background:var(--surface-active);border:1px solid var(--border);border-radius:4px;color:var(--text-secondary)}

.progress-overview{display:none;margin-top:20px;padding:16px 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg)}
.progress-overview.visible{display:block}
.progress-header{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:13px;flex-wrap:wrap}
.progress-count{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.progress-current{color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.progress-time{color:var(--text-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.progress-bar-track{height:4px;background:var(--surface-active);border-radius:4px;overflow:hidden;margin-top:12px}
.progress-bar-fill{height:100%;background:var(--primary);border-radius:4px;width:0%;transition:width 200ms ease}

.queue-section{margin-top:20px}
.queue-list{display:flex;flex-direction:column;gap:4px}
.queue-empty{text-align:center;padding:48px 24px;color:var(--text-muted);font-size:14px;display:none}
.queue-item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);transition:all var(--transition);min-height:60px}
.queue-item:hover{border-color:var(--border-hover)}
.queue-item.item-done{border-color:rgba(34,197,94,.2);background:var(--success-subtle)}
.queue-item.item-fail{border-color:rgba(239,68,68,.2);background:var(--error-subtle)}
.queue-thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;background:var(--surface-active);flex-shrink:0;border:1px solid var(--border)}
.queue-body{min-width:0;display:flex;flex-direction:column;gap:3px}
.queue-name{font-size:13px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;transition:color var(--transition);display:flex;align-items:center;gap:6px}
.queue-name:hover{color:var(--primary)}
.queue-name-input{font-size:13px;font-weight:500;padding:2px 6px;border:1px solid var(--primary);border-radius:4px;background:var(--bg);color:var(--text);outline:none;width:100%;max-width:240px;font-family:inherit}
.queue-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);flex-wrap:wrap}
.queue-meta .sep{color:var(--border)}
.queue-status{font-size:12px;font-weight:500;display:flex;align-items:center;gap:4px}
.queue-status.status-queued{color:var(--text-muted)}
.queue-status.status-uploading{color:var(--primary)}
.queue-status.status-converting{color:var(--warning)}
.queue-status.status-done{color:var(--success)}
.queue-status.status-fail{color:var(--error)}
.queue-status .spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:currentColor;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.queue-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:6px 12px;border:none;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;transition:all var(--transition);text-decoration:none;line-height:1.4;white-space:nowrap;font-family:inherit;color:var(--text-secondary);background:transparent}
.btn:hover{color:var(--text);background:var(--surface-active)}
.btn-icon{padding:6px;width:30px;height:30px}
.btn-icon svg{width:16px;height:16px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#16a34a;color:#fff}
.btn-error{background:var(--error);color:#fff}
.btn-error:hover{background:#dc2626;color:#fff}
.btn-ghost{color:var(--text-muted);padding:4px 8px}
.btn-ghost:hover{color:var(--text);background:var(--surface-active)}
.btn-sm{padding:4px 8px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.compact-info{display:none;align-items:center;gap:8px;font-size:12px;color:var(--success);margin-top:4px;animation:fadeIn 200ms ease}
.compact-info.visible{display:flex}
.compact-info svg{width:14px;height:14px;flex-shrink:0}
.compact-info .orig-size{color:var(--text-muted);text-decoration:line-through}
.compact-info .arrow{color:var(--text-muted)}
.compact-info .webp-size{color:var(--text)}
.compact-info .saved{font-weight:600;color:var(--success)}

.result-url{font-size:11px;color:var(--primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;max-width:200px;display:none}
.result-url.visible{display:block}
.result-url:hover{text-decoration:underline}

.recent-section{margin-top:32px;padding-top:24px;border-top:1px solid var(--border)}
.recent-section.hidden{display:none}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-header h3{margin:0;font-size:13px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em}
.recent-list{display:flex;flex-direction:column;gap:2px}
.recent-item{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--radius);transition:background var(--transition);cursor:default}
.recent-item:hover{background:var(--surface)}
.recent-thumb{width:36px;height:36px;border-radius:4px;object-fit:cover;background:var(--surface-active);border:1px solid var(--border);flex-shrink:0}
.recent-body{min-width:0;display:flex;flex-direction:column;gap:2px}
.recent-name{font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent-time{font-size:11px;color:var(--text-muted)}

.toast-container{position:fixed;top:64px;right:24px;z-index:100;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);font-size:13px;color:var(--text);pointer-events:auto;animation:toastIn 200ms ease;max-width:360px}
.toast.toast-success{border-color:rgba(34,197,94,.3)}
.toast.toast-error{border-color:rgba(239,68,68,.3)}
.toast.toast-exit{animation:toastOut 200ms ease forwards}
.toast-icon{width:18px;height:18px;flex-shrink:0}
.toast-icon svg{width:18px;height:18px}
.toast.toast-success .toast-icon{color:var(--success)}
.toast.toast-error .toast-icon{color:var(--error)}
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(24px)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.skeleton{background:linear-gradient(90deg,var(--surface-active) 25%,var(--surface) 50%,var(--surface-active) 75%);background-size:200% 100%;animation:shimmer .8s ease-in-out infinite;border-radius:6px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

@media(max-width:768px){
.topbar-inner{padding:0 16px;gap:12px}
.brand{font-size:13px}
.stats-group{gap:10px}
.stat{font-size:11px}
.main{padding:16px}
.drop-zone{padding:40px 16px;border-radius:var(--radius-lg)}
.drop-zone.compact{padding:14px 16px;gap:12px}
.drop-zone.compact .drop-icon{width:24px;height:24px}
.drop-zone.compact .drop-icon svg{width:24px;height:24px}
.drop-title{font-size:16px}
.progress-header{font-size:12px;gap:8px}
.queue-item{grid-template-columns:40px 1fr auto;gap:8px;padding:8px 10px;min-height:52px}
.queue-thumb{width:40px;height:40px}
.queue-name{font-size:12px}
.queue-meta{font-size:11px}
.result-url{max-width:120px}
.toast-container{left:16px;right:16px;top:60px}
.toast{max-width:none;font-size:12px}
}
@media(max-width:480px){
.stats-group{gap:6px}
.stat-label{display:none}
.stat-sep:last-child{display:none}
.stat{padding:0 2px}
.drop-zone{padding:32px 16px}
.drop-zone.compact{padding:12px 12px;flex-wrap:wrap;gap:8px}
.drop-zone.compact .drop-title{font-size:13px}
}
</style>
</head>
<body>

<div class="topbar">
<div class="topbar-inner">
<div class="brand"><img src="../assets/logo/icon/main_non_bg_logo.png" alt="RS Machinery" style="height:36px;width:auto;vertical-align:middle"></div>
<button class="theme-btn" id="themeToggle" title="Toggle theme">
<svg class="sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
<svg class="moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>
<div class="stats-group">
<div class="stat"><span class="stat-value" id="statToday">0</span><span class="stat-label">today</span></div>
<div class="stat-sep"></div>
<div class="stat"><span class="stat-value" id="statSaved">0 B</span><span class="stat-label">saved</span></div>
<div class="stat-sep"></div>
<div class="stat"><span class="stat-value" id="statCompression">0%</span><span class="stat-label">avg</span></div>
<div class="stat-sep"></div>
<div class="stat"><span class="stat-value" id="statCount">0</span><span class="stat-label">uploaded</span></div>
</div>
</div>
</div>

<main class="main">

<div class="drop-zone" id="dropZone">
<div class="drop-icon">
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
</div>
<h2 class="drop-title"><strong>Drop Images Here</strong></h2>
<p class="drop-hint">PNG &middot; JPG &middot; JPEG &middot; WEBP &mdash; Max 10MB</p>
<p class="drop-or">or <kbd>Ctrl+V</kbd> to paste</p>
<input type="file" id="fileInput" accept="image/png,image/jpeg,image/jpg,image/webp" multiple>
</div>

<div class="progress-overview" id="progressOverview">
<div class="progress-header">
<span class="progress-count" id="progressCount">0 / 0 Images</span>
<span class="progress-current" id="progressCurrent"></span>
<span class="progress-time" id="progressTime">00:00</span>
</div>
<div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
</div>

<section class="queue-section" id="queueSection">
<div class="queue-list" id="queueList"></div>
<div class="queue-empty" id="queueEmpty">No files yet &mdash; drop images to get started</div>
</section>

<section class="recent-section hidden" id="recentSection">
<div class="section-header">
<h3>Recent Uploads</h3>
<button class="btn btn-ghost btn-sm" id="refreshRecent" title="Refresh">&circlearrowright;</button>
</div>
<div class="recent-list" id="recentList"></div>
</section>

</main>

<div class="toast-container" id="toastContainer"></div>

<script>
(function() {
'use strict';

var CONCURRENCY = 3;
var BASE_URL = 'https://img.rsmachinary.in';

var themeToggle = document.getElementById('themeToggle');

(function initTheme() {
var saved = localStorage.getItem('imgTheme');
var theme = saved || (window.matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
})();

themeToggle.addEventListener('click', function() {
var isLight = document.documentElement.getAttribute('data-theme') === 'light';
if (isLight) {
document.documentElement.removeAttribute('data-theme');
localStorage.setItem('imgTheme', 'dark');
} else {
document.documentElement.setAttribute('data-theme', 'light');
localStorage.setItem('imgTheme', 'light');
}
});

var fileInput = document.getElementById('fileInput');
var dropZone = document.getElementById('dropZone');
var progressOverview = document.getElementById('progressOverview');
var progressCount = document.getElementById('progressCount');
var progressCurrent = document.getElementById('progressCurrent');
var progressTime = document.getElementById('progressTime');
var progressFill = document.getElementById('progressFill');
var queueList = document.getElementById('queueList');
var queueEmpty = document.getElementById('queueEmpty');
var recentSection = document.getElementById('recentSection');
var recentList = document.getElementById('recentList');
var refreshRecent = document.getElementById('refreshRecent');
var toastContainer = document.getElementById('toastContainer');
var statToday = document.getElementById('statToday');
var statSaved = document.getElementById('statSaved');
var statCompression = document.getElementById('statCompression');
var statCount = document.getElementById('statCount');

var queue = [];
var processing = 0;
var completedCount = 0;
var failedCount = 0;
var timerInterval = null;
var timerSeconds = 0;
var stats = loadStats();

renderStats();
loadRecent();

function loadStats() {
var today = new Date().toDateString();
try {
var raw = localStorage.getItem('imgStats');
if (raw) {
var s = JSON.parse(raw);
if (s.date === today) return s;
}
} catch(e) {}
return { date: today, count: 0, bytesSaved: 0, totalOriginal: 0, totalWebp: 0, totalUploaded: 0 };
}

function saveStats() {
try { localStorage.setItem('imgStats', JSON.stringify(stats)); } catch(e) {}
}

function renderStats() {
statToday.textContent = stats.count;
var saved = stats.bytesSaved;
if (saved < 1024) statSaved.textContent = saved + ' B';
else if (saved < 1048576) statSaved.textContent = (saved / 1024).toFixed(1) + ' KB';
else statSaved.textContent = (saved / 1048576).toFixed(1) + ' MB';
var avg = stats.totalOriginal > 0 ? Math.round((1 - stats.totalWebp / stats.totalOriginal) * 100) : 0;
statCompression.textContent = avg + '%';
statCount.textContent = stats.totalUploaded || 0;
}

function addStats(originalSize, webpSize) {
stats.count++;
stats.bytesSaved += (originalSize - webpSize);
stats.totalOriginal += originalSize;
stats.totalWebp += webpSize;
stats.totalUploaded = (stats.totalUploaded || 0) + 1;
saveStats();
renderStats();
}

function getFromQueue(id) {
for (var i = 0; i < queue.length; i++) {
if (queue[i].id === id) return queue[i];
}
return null;
}

function updateQueueItem(id) {
var el = document.getElementById('qi-' + id);
var item = getFromQueue(id);
if (!el || !item) return;

var nameEl = el.querySelector('.queue-name');
if (nameEl && !item.editing) {
nameEl.textContent = item.customName || item.file.name;
}

var metaEl = el.querySelector('.queue-meta');
if (metaEl) {
var parts = [];
if (item.originalSize) parts.push(formatSize(item.originalSize));
if (item.status === 'done' && item.webpSize) {
parts.push('\u2193 ' + formatSize(item.webpSize));
if (item.originalSize) {
var pct = Math.round((1 - item.webpSize / item.originalSize) * 100);
parts.push('\u2212' + pct + '%');
}
}
metaEl.innerHTML = parts.join(' <span class="sep">&middot;</span> ');
}

var statusEl = el.querySelector('.queue-status');
if (statusEl) {
statusEl.className = 'queue-status status-' + item.status;
switch(item.status) {
case 'queued':
statusEl.innerHTML = 'Queued';
break;
case 'uploading':
statusEl.innerHTML = '<span class="spinner"></span> Uploading';
break;
case 'converting':
statusEl.innerHTML = '<span class="spinner"></span> Converting';
break;
case 'done':
statusEl.innerHTML = '\u2713 Converted';
break;
case 'fail':
statusEl.innerHTML = '\u2715 ' + (item.error || 'Failed');
break;
}
}

if (item.status === 'done') {
el.className = 'queue-item item-done';
var urlEl = el.querySelector('.result-url');
if (urlEl && item.url) {
urlEl.textContent = item.url;
urlEl.classList.add('visible');
}
var copyBtn = el.querySelector('.btn-copy-url');
if (copyBtn) copyBtn.style.display = '';
var openBtn = el.querySelector('.btn-open-image');
if (openBtn) openBtn.style.display = '';
var dloadBtn = el.querySelector('.btn-download-image');
if (dloadBtn) { dloadBtn.style.display = ''; dloadBtn.href = item.url; }
var renameBtn = el.querySelector('.btn-rename-image');
if (renameBtn) renameBtn.style.display = '';
} else if (item.status === 'fail') {
el.className = 'queue-item item-fail';
} else {
el.className = 'queue-item';
}
}

function addFiles(files) {
if (!files || !files.length) return;
var added = 0;
Array.from(files).forEach(function(f) {
if (!f.type.match(/^image\/(png|jpeg|jpg|webp)$/)) return;
var dup = queue.some(function(q) { return q.file.name === f.name && q.file.size === f.size && q.status === 'queued'; });
if (!dup) {
var id = Date.now() + '_' + Math.random().toString(36).slice(2,6);
queue.push({ id: id, file: f, status: 'queued', url: '', originalSize: f.size, webpSize: 0, error: '', customName: '', editing: false });
added++;
renderQueueItem(queue[queue.length-1]);
}
});
if (added) {
queueEmpty.style.display = 'none';
if (dropZone.classList.contains('compact') === false) {
dropZone.classList.add('compact');
}
progressOverview.classList.add('visible');
if (!timerInterval) startTimer();
processNext();
}
}

function renderQueueItem(item) {
var existing = document.getElementById('qi-' + item.id);
if (existing) {
updateQueueItem(item.id);
return;
}
var el = document.createElement('div');
el.className = 'queue-item';
el.id = 'qi-' + item.id;

var thumbDiv = document.createElement('div');
thumbDiv.className = 'queue-thumb';
(function(f, div) {
var r = new FileReader();
r.onload = function(e) { div.style.background = 'url(' + e.target.result + ') center/cover'; };
r.readAsDataURL(f);
})(item.file, thumbDiv);

var body = document.createElement('div');
body.className = 'queue-body';

var nameRow = document.createElement('div');
nameRow.className = 'queue-name';
nameRow.textContent = item.customName || item.file.name;
nameRow.title = 'Click to rename';
(function(id, nameRow) {
nameRow.addEventListener('click', function() {
startEdit(id);
});
})(item.id, nameRow);

var meta = document.createElement('div');
meta.className = 'queue-meta';

resultUrl.className = 'result-url';
resultUrl.title = 'Click to copy URL';
(function(id) {
resultUrl.addEventListener('click', function() {
var item = getFromQueue(id);
if (item && item.url) {
copyText(item.url);
showToast('URL copied', 'success');
}
});
})(item.id);

body.appendChild(nameRow);
body.appendChild(meta);
body.appendChild(resultUrl);

var actions = document.createElement('div');
actions.className = 'queue-actions';

var statusEl = document.createElement('span');
statusEl.className = 'queue-status status-queued';
statusEl.textContent = 'Queued';

var copyBtn = document.createElement('button');
copyBtn.className = 'btn btn-icon btn-copy-url';
copyBtn.style.display = 'none';
copyBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
copyBtn.title = 'Copy URL';
(function(id) {
copyBtn.addEventListener('click', function(e) {
e.stopPropagation();
var item = getFromQueue(id);
if (item && item.url) {
copyText(item.url);
showToast('URL copied', 'success');
}
});
})(item.id);

var openBtn = document.createElement('button');
openBtn.className = 'btn btn-icon btn-open-image';
openBtn.style.display = 'none';
openBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
openBtn.title = 'Open image';
(function(id) {
openBtn.addEventListener('click', function(e) {
e.stopPropagation();
var item = getFromQueue(id);
if (item && item.url) window.open(item.url, '_blank');
});
})(item.id);

var dloadBtn = document.createElement('a');
dloadBtn.className = 'btn btn-icon btn-download-image';
dloadBtn.style.display = 'none';
dloadBtn.target = '_blank';
dloadBtn.rel = 'noopener';
dloadBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
dloadBtn.title = 'Download';
(function(id) {

})(item.id);

function removeFromQueue(id) {
var idx = -1;
for (var i = 0; i < queue.length; i++) {
if (queue[i].id === id) { idx = i; break; }
}
if (idx === -1) return;
var item = queue[idx];
if (item.status === 'uploading' || item.status === 'converting') return;
queue.splice(idx, 1);
var el = document.getElementById('qi-' + id);
if (el) el.remove();
updateProgress();
if (!queue.length) {
queueEmpty.style.display = 'block';
progressOverview.classList.remove('visible');
stopTimer();
dropZone.classList.remove('compact');
}
}

function startEdit(id) {
var item = getFromQueue(id);
if (!item || item.status !== 'queued') return;
var el = document.getElementById('qi-' + id);
if (!el) return;
var nameEl = el.querySelector('.queue-name');
if (!nameEl) return;
item.editing = true;
var input = document.createElement('input');
input.className = 'queue-name-input';
input.type = 'text';
input.value = item.customName || item.file.name.replace(/\.[^.]+$/, '');
input.maxLength = 48;
nameEl.textContent = '';
nameEl.appendChild(input);
input.focus();
input.select();
input.addEventListener('blur', function() {
finishEdit(id, input.value);
});
input.addEventListener('keydown', function(e) {
if (e.key === 'Enter') { input.blur(); }
if (e.key === 'Escape') { input.value = item.customName || item.file.name.replace(/\.[^.]+$/, ''); input.blur(); }
});
}

function finishEdit(id, val) {
var item = getFromQueue(id);
if (!item) return;
var clean = val.trim().replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 48);
if (clean) item.customName = clean;
item.editing = false;
var el = document.getElementById('qi-' + id);
if (el) {
var nameEl = el.querySelector('.queue-name');
if (nameEl) nameEl.textContent = item.customName || item.file.name;
}
}

function startPostRename(id) {
var item = getFromQueue(id);
if (!item || item.status !== 'done' || !item.url) return;
var filename = item.url.split('/').pop();
if (!filename) return;
var el = document.getElementById('qi-' + id);
if (!el) return;
var nameEl = el.querySelector('.queue-name');
if (!nameEl) return;
var input = document.createElement('input');
input.className = 'queue-name-input';
input.type = 'text';
input.value = filename.replace(/\.webp$/, '');
input.maxLength = 48;
nameEl.textContent = '';
nameEl.appendChild(input);
input.focus();
input.select();
input.addEventListener('blur', function() {
finishPostRename(id, filename, input.value);
});
input.addEventListener('keydown', function(e) {
if (e.key === 'Enter') { input.blur(); }
if (e.key === 'Escape') { input.value = filename.replace(/\.webp$/, ''); input.blur(); }
});
}

function finishPostRename(id, oldFilename, val) {
var item = getFromQueue(id);
if (!item) return;
var el = document.getElementById('qi-' + id);
var nameEl = el ? el.querySelector('.queue-name') : null;
var newName = val.trim().replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 48);
if (!newName || newName === oldFilename.replace(/\.webp$/, '')) {
if (nameEl) nameEl.textContent = item.customName || item.file.name;
return;
}
if (nameEl) nameEl.textContent = newName + '...';
fetch('rename.php', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ filename: oldFilename, newname: newName })
})
.then(function(r) { return r.json(); })
.then(function(res) {
if (res.success) {
item.url = res.url;
item.customName = res.filename;
updateQueueItem(item.id);
showToast('Renamed to ' + res.filename, 'success');
loadRecent();
} else {
if (nameEl) nameEl.textContent = oldFilename;
showToast(res.error || 'Rename failed', 'error');
}
})
.catch(function() {
if (nameEl) nameEl.textContent = oldFilename;
showToast('Network error', 'error');
});
}

function processNext() {
while (processing < CONCURRENCY) {
var next = null;
for (var i = 0; i < queue.length; i++) {
if (queue[i].status === 'queued') { next = queue[i]; break; }
}
if (!next) break;
processing++;
next.status = 'uploading';
updateQueueItem(next.id);
uploadFile(next);
}
}

function uploadFile(item) {
var fd = new FormData();
fd.append('image', item.file);
var name = item.customName.trim();
if (name) fd.append('name', name);

var xhr = new XMLHttpRequest();
xhr.open('POST', 'upload.php', true);

xhr.upload.onprogress = function(e) {
if (e.lengthComputable && item.status === 'uploading') {
var pct = Math.round((e.loaded / e.total) * 100);
var metaEl = document.getElementById('qi-' + item.id);
if (metaEl) {
var m = metaEl.querySelector('.queue-meta');
if (m) m.innerHTML = formatSize(item.file.size) + ' <span class="sep">&middot;</span> uploading ' + pct + '%';
}
}
};

xhr.onload = function() {
item.status = 'converting';
updateQueueItem(item.id);
try {
var res = JSON.parse(xhr.responseText);
if (res.success) {
item.status = 'done';
item.url = res.url;
item.webpSize = res.size;
    completedCount++;
    addStats(item.originalSize, item.webpSize);
    updateQueueItem(item.id);
    copyText(item.url);
    showToast('\u2705 URL copied to clipboard', 'success');
    processing--;
    processNext();
    checkAllDone();
} else {
failItem(item, res.error || 'Conversion failed');
}
} catch(e) {
failItem(item, 'Invalid response');
}
};

xhr.onerror = function() {
failItem(item, 'Network error');
};

xhr.onabort = function() {
processing--;
item.status = 'queued';
updateQueueItem(item.id);
processNext();
};

xhr.send(fd);
}

function failItem(item, msg) {
item.status = 'fail';
item.error = msg;
failedCount++;
updateQueueItem(item.id);
processing--;
processNext();
checkAllDone();
}

function checkAllDone() {
var pending = 0;
for (var i = 0; i < queue.length; i++) {
if (queue[i].status === 'queued' || queue[i].status === 'uploading' || queue[i].status === 'converting') pending++;
}
if (pending === 0) {
stopTimer();
}
updateProgress();
}

function updateProgress() {
var total = queue.length;
var done = 0;
var current = '';
for (var i = 0; i < queue.length; i++) {
if (queue[i].status === 'done' || queue[i].status === 'fail') done++;
if (queue[i].status === 'uploading' || queue[i].status === 'converting') {
current = queue[i].customName || queue[i].file.name;
}
}
progressCount.textContent = done + ' / ' + total + ' Images';
if (current) progressCurrent.textContent = current;
else progressCurrent.textContent = '';
progressFill.style.width = total > 0 ? Math.round(done / total * 100) + '%' : '0%';
}

function startTimer() {
timerSeconds = 0;
timerInterval = setInterval(function() {
timerSeconds++;
var m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
var s = String(timerSeconds % 60).padStart(2, '0');
progressTime.textContent = m + ':' + s;
}, 1000);
}

function stopTimer() {
if (timerInterval) {
clearInterval(timerInterval);
timerInterval = null;
}
}

function showToast(msg, type) {
var t = document.createElement('div');
t.className = 'toast' + (type ? ' toast-' + type : '');
t.innerHTML = '<span class="toast-icon">' + (type === 'success' ? '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' : type === 'error' ? '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>' : '') + '</span>' + msg;
toastContainer.appendChild(t);
setTimeout(function() {
t.classList.add('toast-exit');
setTimeout(function() { t.remove(); }, 200);
}, 2500);
}

function copyText(text) {
try {
if (navigator.clipboard && navigator.clipboard.writeText) {
navigator.clipboard.writeText(text);
} else {
var ta = document.createElement('textarea');
ta.value = text;
ta.style.cssText = 'position:fixed;opacity:0';
document.body.appendChild(ta);
ta.select();
document.execCommand('copy');
document.body.removeChild(ta);
}
} catch(e) {}
}

function loadRecent() {
recentSection.classList.remove('hidden');
recentList.innerHTML = '';
for (var i = 0; i < 5; i++) {
var skel = document.createElement('div');
skel.className = 'recent-item';
skel.innerHTML = '<div class="recent-thumb skeleton"></div><div class="recent-body"><div class="skeleton" style="height:14px;width:60%;margin-bottom:4px"></div><div class="skeleton" style="height:11px;width:40%"></div></div><div style="display:flex;gap:4px"><div class="skeleton" style="width:30px;height:30px;border-radius:6px"></div><div class="skeleton" style="width:30px;height:30px;border-radius:6px"></div></div>';
recentList.appendChild(skel);
}
fetch('list.php')
.then(function(r) { return r.json(); })
.then(function(res) {
if (res.success && res.data && res.data.length) {
renderRecent(res.data.slice(0, 20));
} else {
recentSection.classList.add('hidden');
}
})
.catch(function() {});
}

function renderRecent(items) {
recentList.innerHTML = '';
items.forEach(function(img) {
var el = document.createElement('div');
el.className = 'recent-item';

var thumb = document.createElement('div');
thumb.className = 'recent-thumb';
thumb.style.background = 'url(' + img.url + ') center/cover';

var body = document.createElement('div');
body.className = 'recent-body';

var nameEl = document.createElement('div');
nameEl.className = 'recent-name';
nameEl.textContent = img.filename;
nameEl.title = img.filename;

var timeEl = document.createElement('div');
timeEl.className = 'recent-time';
var d = new Date(img.modified * 1000);
var now = new Date();
var diff = Math.round((now - d) / 1000);
if (diff < 60) timeEl.textContent = 'just now';
else if (diff < 3600) timeEl.textContent = Math.round(diff / 60) + 'm ago';
else if (diff < 86400) timeEl.textContent = Math.round(diff / 3600) + 'h ago';
else timeEl.textContent = d.toLocaleDateString();
if (img.size_formatted) timeEl.textContent += ' \u00b7 ' + img.size_formatted;

body.appendChild(nameEl);
body.appendChild(timeEl);

var actions = document.createElement('div');
actions.className = 'queue-actions';

var copyBtn = document.createElement('button');
copyBtn.className = 'btn btn-icon';
copyBtn.title = 'Copy URL';
copyBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
(function(url) {
copyBtn.addEventListener('click', function(e) { e.stopPropagation(); copyText(url); showToast('URL copied', 'success'); });
})(img.url);

var openBtn = document.createElement('button');
openBtn.className = 'btn btn-icon';
openBtn.title = 'Open';
openBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
(function(url) {
openBtn.addEventListener('click', function(e) { e.stopPropagation(); window.open(url, '_blank'); });
})(img.url);

var delBtn = document.createElement('button');
delBtn.className = 'btn btn-icon';
delBtn.title = 'Delete';
delBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
(function(filename, btn) {
delBtn.addEventListener('click', function(e) {
e.stopPropagation();
btn.disabled = true;
btn.innerHTML = '...';
fetch('delete.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ filename: filename }) })
.then(function(r) { return r.json(); })
.then(function(res) {
if (res.success) { showToast('Deleted', 'success'); loadRecent(); }
else showToast(res.error || 'Delete failed', 'error');
btn.disabled = false;
btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
})
.catch(function() { showToast('Network error', 'error'); btn.disabled = false; btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
});
});
})(img.filename, delBtn);

actions.appendChild(copyBtn);
actions.appendChild(openBtn);
actions.appendChild(delBtn);

el.appendChild(thumb);
el.appendChild(body);
el.appendChild(actions);

recentList.appendChild(el);
});
}

function formatSize(bytes) {
if (bytes < 1024) return bytes + ' B';
if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
return (bytes / 1048576).toFixed(1) + ' MB';
}

fileInput.addEventListener('change', function() {
addFiles(fileInput.files);
fileInput.value = '';
});

dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('drag-over'); });
dropZone.addEventListener('drop', function(e) {
e.preventDefault();
dropZone.classList.remove('drag-over');
addFiles(e.dataTransfer.files);
});

document.addEventListener('paste', function(e) {
var items = e.clipboardData && e.clipboardData.items;
if (!items) return;
var files = [];
for (var i = 0; i < items.length; i++) {
if (items[i].type.startsWith('image/')) {
var f = items[i].getAsFile();
if (f) {
var ext = items[i].type.split('/')[1] || 'png';
f.name = 'clipboard_' + Date.now() + '.' + ext;
files.push(f);
}
}
}
if (files.length) {
e.preventDefault();
addFiles(files);
showToast(files.length + ' image' + (files.length > 1 ? 's' : '') + ' pasted', 'success');
}
});

document.addEventListener('keydown', function(e) {
if (e.ctrlKey && e.key === 'u') {
e.preventDefault();
fileInput.click();
}
if (e.ctrlKey && e.key === 'c') {
for (var i = queue.length - 1; i >= 0; i--) {
if (queue[i].status === 'done' && queue[i].url) {
copyText(queue[i].url);
showToast('URL copied', 'success');
e.preventDefault();
return;
}
}
}
if (e.key === 'Escape') {
var active = [];
for (var i = 0; i < queue.length; i++) {
if (queue[i].status === 'uploading' || queue[i].status === 'converting') active.push(queue[i]);
}
if (active.length) {
active.forEach(function(item) {
item.status = 'queued';
updateQueueItem(item.id);
});
showToast('Cancelled ' + active.length + ' upload' + (active.length > 1 ? 's' : ''), 'success');
} else {
stopTimer();
progressOverview.classList.remove('visible');
}
}
if (e.key === 'Delete' && !e.ctrlKey && !e.metaKey) {
var target = e.target;
if (target && (target.tagName === 'INPUT' || target.isContentEditable)) return;
for (var i = queue.length - 1; i >= 0; i--) {
if (queue[i].status === 'queued') {
removeFromQueue(queue[i].id);
e.preventDefault();
return;
}
}
}
});

refreshRecent.addEventListener('click', loadRecent);

})();
